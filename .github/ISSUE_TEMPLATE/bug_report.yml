name: Bug
description: Comportamento errado, erro ou regressão
labels: [bug]
body:
  - type: textarea
    id: esperado
    attributes: { label: O que você esperava }
    validations: { required: true }
  - type: textarea
    id: aconteceu
    attributes: { label: O que aconteceu, com comando e saída }
    validations: { required: true }
  - type: input
    id: versao
    attributes: { label: Versão ou commit }
    validations: { required: true }
  - type: dropdown
    id: motor
    attributes:
      label: Motor
      options: [simulado, baileys (real), não sei]
  - type: checkboxes
    id: segredo
    attributes:
      label: Confirmação
      options:
        - label: Removi chave, QR, número e credencial desta issue
          required: true
